<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sem Conexão — RVS Gestor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 400px;
      width: 100%;
    }
    .icon { font-size: 64px; margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
    p { font-size: 14px; color: rgba(255,255,255,0.6); line-height: 1.6; margin-bottom: 28px; }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn:hover { transform: translateY(-2px); opacity: 0.9; }
    .logo {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      font-size: 28px;
    }
    .school-name { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🏫</div>
    <div class="icon">📵</div>
    <h1>Sem Conexão com a Internet</h1>
    <p>O RVS Gestor precisa de conexão para acessar o banco de dados da escola.<br>Verifique sua internet e tente novamente.</p>
    <button class="btn" onclick="window.location.reload()">🔄 Tentar Novamente</button>
    <div class="school-name">Escola Estadual Dr. Romildo Veloso e Silva — SEDUC/PA</div>
  </div>
</body>
</html>
