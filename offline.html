<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sem Conexão — RVS Gestor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      /* Já alinhado ao tema SIGAEDU unificado do projeto — sem conflito de :root aqui */
      --primary: #171513;
      --primary-soft: #352f29;
      --secondary: #f4cf4d;
      --line: #e6dacd;
      --muted: #6f655d;
      --page: #f6f0e9;
      --surface: rgba(255,255,255,.86);
      --radius3: 24px;
      --shadow3: 0 28px 68px rgba(55,39,24,.14), 0 10px 24px rgba(55,39,24,.08);
    }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: linear-gradient(180deg, #fbf7f2 0%, #f3ebe2 55%, #ede2d6 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      text-align: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle 360px at 15% 10%, rgba(244, 207, 77, 0.25) 0%, transparent 58%),
        radial-gradient(circle 420px at 100% 0%, rgba(23, 21, 19, 0.08) 0%, transparent 60%);
    }
    .card {
      background: var(--surface);
      backdrop-filter: blur(16px);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 48px 40px;
      max-width: 430px;
      width: 100%;
      box-shadow: 0 32px 70px rgba(56, 39, 22, 0.14), 0 10px 24px rgba(56, 39, 22, 0.08);
      position: relative;
      z-index: 1;
    }
    .icon { font-size: 64px; margin-bottom: 20px; }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 12px; letter-spacing: -0.03em; }
    p { font-size: 14px; color: var(--muted); line-height: 1.7; margin-bottom: 28px; }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, var(--primary), var(--primary-soft));
      color: white;
      border: none;
      border-radius: 14px;
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
      text-decoration: none;
      box-shadow: 0 16px 30px rgba(23, 21, 19, 0.16);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 20px 34px rgba(23, 21, 19, 0.2); }
    .logo {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, var(--secondary), #ffe27a);
      color: var(--primary);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      font-size: 28px;
      box-shadow: 0 18px 36px rgba(226, 185, 44, 0.24);
    }
    .school-name { font-size: 11px; color: #8f8072; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🏫</div>
    <div class="icon">📵</div>
    <h1>Sem Conexão com a Internet</h1>
    <p>O RVS Gestor precisa de conexão para acessar o banco de dados da escola.<br>Verifique sua internet e tente novamente.</p>
    <button class="btn" onclick="window.location.reload()">🔄 Tentar Novamente</button>
    <div class="school-name">Escola Estadual Dr. Romildo Veloso e Silva — SEDUC/PA</div>
  </div>
</body>
</html>
